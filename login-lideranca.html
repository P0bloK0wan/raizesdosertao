<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login da Liderança — Raízes do Sertão</title>
<meta name="theme-color" content="#060403">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="back-link">← Voltar ao site</a>
    <div class="brand"><img src="assets/img/logo.png" alt="Raízes do Sertão" style="height:52px;"></div>
    <h1>Área da Liderança</h1>
    <p class="sub muted">Acompanhe as vagas do Lava Jato e os desbravadores de todas as unidades.</p>

    <div class="alert alert-error" id="erro"></div>

    <form id="form-login">
      <div class="field">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" value="lideranca" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit">Entrar</button>
    </form>

    <p class="form-note">É de uma unidade? <a href="login-unidade.html" style="color:var(--orange); font-weight:700;">Entre por aqui</a>.<br>Senha padrão de demonstração: <code>raizes2026</code></p>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const form = document.getElementById("form-login");
  const erro = document.getElementById("erro");

  const sessaoAtual = RS.getSession();
  if (sessaoAtual && sessaoAtual.papel === "lideranca") {
    window.location.href = "painel-lideranca.html";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.classList.remove("show");
    const usuario = form.usuario.value;
    const senha = form.senha.value;
    try {
      await RS_AUTH.loginLideranca(usuario, senha);
      window.location.href = "painel-lideranca.html";
    } catch (err) {
      erro.textContent = err.message;
      erro.classList.add("show");
    }
  });
</script>
</body>
</html>
