<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login da Liderança — Raízes do Sertão</title>
<meta name="theme-color" content="#060403">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="back-link">← Voltar ao site</a>
    <div class="brand"><img src="assets/img/logo.png" alt="Raízes do Sertão" style="height:52px;"></div>
    <h1>Área da Liderança</h1>
    <p class="sub muted">Acompanhe as vagas do Lava Jato e os desbravadores de todas as unidades, de qualquer aparelho.</p>

    <div class="alert alert-error" id="erro"></div>

    <form id="form-login">
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit">Entrar</button>
    </form>

    <p class="form-note">É de uma unidade? <a href="login-unidade.html" style="color:var(--orange); font-weight:700;">Entre por aqui</a>.</p>
  </div>
</div>

<script type="module">
  import "./assets/js/main.js";
  import { loginLideranca, mensagemErroFirebase, firebaseConfigurado } from "./assets/js/auth.js";
  import { auth } from "./assets/js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const form = document.getElementById("form-login");
  const erro = document.getElementById("erro");

  if (!firebaseConfigurado) {
    erro.textContent = "O site ainda não foi configurado com as chaves do Firebase (veja o README.md).";
    erro.classList.add("show");
  }

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === "lideranca@raizesdosertao.app") {
      window.location.href = "painel-lideranca.html";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.classList.remove("show");
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      await loginLideranca(form.senha.value);
      window.location.href = "painel-lideranca.html";
    } catch (err) {
      erro.textContent = mensagemErroFirebase(err);
      erro.classList.add("show");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
