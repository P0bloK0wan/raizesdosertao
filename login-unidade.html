<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login da Unidade — Raízes do Sertão</title>
<meta name="theme-color" content="#78A83B">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="back-link">← Voltar ao site</a>
    <div class="brand"><img src="assets/img/logo.png" alt="Raízes do Sertão" style="height:52px;"></div>
    <h1>Login da Unidade</h1>
    <p class="sub muted">Cadastre os desbravadores da sua unidade e feche vagas do Lava Jato, de qualquer aparelho.</p>

    <div class="alert alert-error" id="erro"></div>

    <form id="form-login">
      <div class="field">
        <label for="unidade">Unidade</label>
        <select id="unidade" name="unidade" required></select>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-green btn-block" type="submit">Entrar</button>
    </form>

    <p class="form-note">É da diretoria? <a href="login-lideranca.html" style="color:var(--orange); font-weight:700;">Entre por aqui</a>.</p>
  </div>
</div>

<script type="module">
  import "./assets/js/main.js";
  import { RS_UNIDADES, emailDaUnidade } from "./assets/js/data.js";
  import { loginUnidade, aplicarSenhaAprovada, mensagemErroFirebase, firebaseConfigurado } from "./assets/js/auth.js";
  import { consultarPedidoSenha, limparPedidoSenha } from "./assets/js/store.js";
  import { auth } from "./assets/js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const select = document.getElementById("unidade");
  select.innerHTML = RS_UNIDADES.map((u) => `<option value="${u.id}">${u.nome}</option>`).join("");

  const form = document.getElementById("form-login");
  const erro = document.getElementById("erro");

  if (!firebaseConfigurado) {
    erro.textContent = "O site ainda não foi configurado com as chaves do Firebase (veja o README.md).";
    erro.classList.add("show");
  }

  /* Enquanto o formulário estiver processando o login (incluindo a
     checagem de troca de senha aprovada), esse redirecionamento
     automático fica pausado — senão ele dispara assim que o login
     autentica e "ganha a corrida" da navegação antes da checagem de
     senha terminar. Ele serve pra quando alguém já está logado e
     visita essa página direto (sem passar pelo formulário). */
  let enviandoFormulario = false;
  const emailsDeUnidade = RS_UNIDADES.map((u) => emailDaUnidade(u.id));
  onAuthStateChanged(auth, (user) => {
    if (!enviandoFormulario && user && emailsDeUnidade.includes(user.email)) {
      window.location.href = "painel-unidade.html";
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.classList.remove("show");
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    enviandoFormulario = true;
    try {
      await loginUnidade(select.value, form.senha.value);

      let senhaTrocada = false;
      try {
        const pedido = await consultarPedidoSenha(select.value);
        if (pedido && pedido.status === "aprovada") {
          await aplicarSenhaAprovada(pedido.senhaNova);
          await limparPedidoSenha(select.value);
          senhaTrocada = true;
        }
      } catch (erroSenha) {
        console.warn("Não foi possível aplicar a troca de senha aprovada:", erroSenha);
      }

      window.location.href = "painel-unidade.html" + (senhaTrocada ? "?senha-trocada=1" : "");
    } catch (err) {
      enviandoFormulario = false;
      erro.textContent = mensagemErroFirebase(err);
      erro.classList.add("show");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
