<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login da Unidade — Raízes do Sertão</title>
<meta name="theme-color" content="#78A83B">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="back-link">← Voltar ao site</a>
    <div class="brand"><img src="assets/img/logo.png" alt="Raízes do Sertão" style="height:52px;"></div>
    <h1>Login da Unidade</h1>
    <p class="sub muted">Cadastre os desbravadores da sua unidade e feche vagas do Lava Jato.</p>

    <div class="alert alert-error" id="erro"></div>

    <form id="form-login">
      <div class="field">
        <label for="unidade">Unidade</label>
        <select id="unidade" name="unidade" required></select>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-green btn-block" type="submit">Entrar</button>
    </form>

    <p class="form-note">É da diretoria? <a href="login-lideranca.html" style="color:var(--orange); font-weight:700;">Entre por aqui</a>.<br>Senha padrão de demonstração: <code>sertao123</code></p>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/main.js"></script>
<script>
  const select = document.getElementById("unidade");
  select.innerHTML = RS_UNIDADES.map((u) => `<option value="${u.id}">${u.nome}</option>`).join("");

  const form = document.getElementById("form-login");
  const erro = document.getElementById("erro");

  const sessaoAtual = RS.getSession();
  if (sessaoAtual && sessaoAtual.papel === "unidade") {
    window.location.href = "painel-unidade.html";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.classList.remove("show");
    try {
      await RS_AUTH.loginUnidade(select.value, form.senha.value);
      window.location.href = "painel-unidade.html";
    } catch (err) {
      erro.textContent = err.message;
      erro.classList.add("show");
    }
  });
</script>
</body>
</html>
