<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E97305"><title>Gerenciar agenda pública — Raízes do Sertão</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/nordeste.css"><link rel="stylesheet" href="assets/css/publico.css"></head><body><div data-site-header></div><main class="section"><div class="container" style="max-width:820px"><a href="painel-lideranca.html">← Voltar ao painel da liderança</a><h1>Agenda pública</h1><p>Publique apenas informações aprovadas para divulgação. Nunca inclua dados pessoais dos desbravadores ou locais de atividades privadas.</p><form id="form-evento-publico" class="card" style="display:grid;gap:14px;padding:22px"><h2>Novo evento público</h2><div class="field"><label for="ev-titulo">Título</label><input id="ev-titulo" maxlength="120" minlength="3" required></div><div class="field"><label for="ev-data">Data</label><input id="ev-data" type="date" required></div><div class="field"><label for="ev-local">Local público (opcional)</label><input id="ev-local" maxlength="150"></div><div class="field"><label for="ev-descricao">Descrição</label><textarea id="ev-descricao" maxlength="800" rows="3"></textarea></div><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ev-publicado"> Publicar imediatamente na agenda pública</label><button type="submit" class="btn btn-primary">Salvar evento</button><p id="ev-status" role="status" aria-live="polite"></p></form><section style="margin-top:32px"><h2>Eventos cadastrados</h2><div id="ev-lista" class="public-grid">Carregando…</div></section></div></main><div data-site-footer></div><script type="module" src="assets/js/main.js"></script><script type="module" src="assets/js/agenda-admin.js"></script></body></html>
