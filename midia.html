<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mídia — Raízes do Sertão</title><meta name="theme-color" content="#E97305">
<link rel="icon" href="assets/img/logo.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/nordeste.css">
</head>
<body>
<div data-site-header></div>
<main class="section midia-page"><div class="container">
  <div class="section-head midia-heading"><span class="eyebrow">Nossos momentos</span><h1>Galeria de fotos</h1><p>Um pedacinho da nossa história em cada registro. 🌵</p></div>
  <div id="midia-pastas" class="midia-albuns" aria-live="polite"></div>
</div></main>
<div class="midia-lightbox" id="midia-lightbox" hidden role="dialog" aria-modal="true" aria-label="Visualizar foto">
  <button type="button" class="midia-fechar" id="midia-fechar" aria-label="Fechar foto">×</button>
  <img id="midia-foto-ampliada" alt=""><p id="midia-legenda"></p><a id="midia-baixar" class="midia-link midia-download" href="#" target="_blank" rel="noopener noreferrer">⬇ Baixar foto original</a>
</div>
<div data-site-footer></div>
<script type="module">
import { watchMidia } from "./assets/js/store.js";
const wrap = document.getElementById("midia-pastas");
const lightbox = document.getElementById("midia-lightbox");
const fotoAmpliada = document.getElementById("midia-foto-ampliada");
const legenda = document.getElementById("midia-legenda");
const baixar = document.getElementById("midia-baixar");
document.getElementById("midia-fechar").addEventListener("click", fecharFoto);
lightbox.addEventListener("click", e => { if (e.target === lightbox) fecharFoto(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharFoto(); });
function fecharFoto(){lightbox.hidden = true;fotoAmpliada.removeAttribute("src");baixar.removeAttribute("href");document.body.style.overflow = "";}
function urlFoto(link) {
  try {
    const url = new URL(link);
    if (url.protocol !== "https:") return null;
    if (["drive.google.com","www.drive.google.com"].includes(url.hostname)) {
      const id = url.pathname.match(/\/file\/d\/([\w-]+)/)?.[1] || url.searchParams.get("id");
      return id && /^[\w-]+$/.test(id) ? "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w1600" : null;
    }
    if (url.hostname === "res.cloudinary.com" || url.hostname.endsWith(".res.cloudinary.com")) return url.href;
    return null;
  } catch { return null; }
}
// Miniaturas leves para a galeria; o link de download usa o arquivo original.
function miniatura(src) {
  try {
    const url = new URL(src);
    if (url.hostname === "res.cloudinary.com" && url.pathname.includes("/image/upload/")) {
      url.pathname = url.pathname.replace("/image/upload/", "/image/upload/c_fill,w_640,h_640,q_auto/");
      return url.href;
    }
  } catch {}
  return src;
}
function downloadOriginal(src) {
  try {
    const url = new URL(src);
    if (url.hostname === "res.cloudinary.com" && url.pathname.includes("/image/upload/")) {
      // fl_attachment força o download sem reduzir dimensões nem qualidade.
      url.pathname = url.pathname.replace("/image/upload/", "/image/upload/fl_attachment/");
      return url.href;
    }
  } catch {}
  // Fotos antigas do Drive não garantem download original via miniatura.
  return src;
}
function idPastaDrive(link) {
  try {
    const url = new URL(link);
    if (!["drive.google.com","www.drive.google.com"].includes(url.hostname)) return null;
    const id = url.pathname.match(/\/folders\/([\w-]+)/)?.[1] || url.searchParams.get("id");
    return id && /^[\w-]+$/.test(id) ? id : null;
  } catch { return null; }
}
function render(pastas) {
  wrap.replaceChildren();
  if (!pastas.length) {
    const empty = document.createElement("div");empty.className="empty-state";empty.textContent="Os álbuns ainda estão sendo preparados. Volte em breve!";wrap.append(empty);return;
  }
  for (const pasta of pastas) {
    const idDrive = idPastaDrive(pasta.link);
    const fotos = (Array.isArray(pasta.fotos) ? pasta.fotos : []).map(urlFoto).filter(Boolean);
    const card = document.createElement("article");card.className="midia-album";
    const head = document.createElement("div");head.className="midia-album-head";
    const title = document.createElement("h2");title.textContent=(idDrive ? "📁 " : "") + (pasta.nome || "Nosso álbum");
    const tag = document.createElement("span");tag.className="midia-album-tag";tag.textContent=idDrive ? "Google Drive" : (fotos.length ? fotos.length+" fotos" : "Álbum");
    head.append(title,tag);card.append(head);
    if (idDrive) {
      const pastaVisual = document.createElement("div"); pastaVisual.className = "midia-pasta-drive";
      const icone = document.createElement("span"); icone.textContent = "📁"; icone.setAttribute("aria-hidden","true");
      const texto = document.createElement("p"); texto.textContent = "Fotos disponíveis no Google Drive";
      pastaVisual.append(icone,texto); card.append(pastaVisual);
      const abrir = document.createElement("a"); abrir.className = "midia-link"; abrir.href = "https://drive.google.com/drive/folders/" + encodeURIComponent(idDrive); abrir.target = "_blank"; abrir.rel = "noopener noreferrer"; abrir.textContent = "Abrir pasta no Drive ↗"; card.append(abrir);
    } else if (fotos.length) {
      const grid = document.createElement("div");grid.className="midia-fotos";
      fotos.forEach((src,i) => {
        const btn=document.createElement("button");btn.type="button";btn.className="midia-foto";btn.setAttribute("aria-label","Ampliar foto "+(i+1)+" de "+title.textContent);
        const img=document.createElement("img");img.src=miniatura(src);img.alt=title.textContent+" — foto "+(i+1);img.loading="lazy";img.decoding="async";
        btn.append(img);btn.addEventListener("click",()=>{fotoAmpliada.src=src;fotoAmpliada.alt=img.alt;legenda.textContent=title.textContent;baixar.href=downloadOriginal(src);baixar.textContent=src.includes("drive.google.com") ? "↗ Abrir foto no Drive" : "⬇ Baixar em resolução original";lightbox.hidden=false;document.body.style.overflow="hidden";});grid.append(btn);
      });card.append(grid);
    } else {
      const capa=document.createElement("div");capa.className="midia-capa-vazia";
      const simbolo=document.createElement("span");simbolo.textContent="📷";simbolo.setAttribute("aria-hidden","true");
      const txt=document.createElement("p");txt.textContent="As fotos deste álbum ainda não foram enviadas.";
      capa.append(simbolo,txt);card.append(capa);
    }
    wrap.append(card);
  }
}
watchMidia(render);
</script>
<script type="module" src="assets/js/main.js"></script>
</body></html>
