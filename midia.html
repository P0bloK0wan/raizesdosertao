<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mídia — Raízes do Sertão</title>
<meta name="theme-color" content="#E97305">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div data-site-header></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Registros</span>
      <h1>Mídia</h1>
      <p>Fotos e vídeos dos nossos eventos, acampamentos e edições do Lava Jato — organizados em pastas pela diretoria.</p>
    </div>
    <div id="midia-pastas"></div>
  </div>
</section>

<div class="lightbox-backdrop" id="lightbox">
  <button class="lightbox-close" id="lightbox-fechar" aria-label="Fechar">✕</button>
  <img id="lightbox-img" alt="">
  <a class="btn btn-primary" id="lightbox-baixar" download target="_blank" rel="noopener">⬇️ Baixar foto</a>
</div>

<div data-site-footer></div>

<script type="module">
  import { watchMidia } from "./assets/js/store.js";
  import { buscarFotosDaPasta } from "./assets/js/midia-drive.js";

  const wrap = document.getElementById("midia-pastas");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxBaixar = document.getElementById("lightbox-baixar");

  function abrirLightbox(foto) {
    lightboxImg.src = foto.visualizar;
    lightboxImg.alt = foto.nome;
    lightboxBaixar.href = foto.baixar;
    lightbox.classList.add("show");
  }
  function fecharLightbox() {
    lightbox.classList.remove("show");
    lightboxImg.src = "";
  }
  document.getElementById("lightbox-fechar").addEventListener("click", fecharLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) fecharLightbox(); });

  function cardPasta(p, fotos) {
    if (!fotos || !fotos.length) {
      return `
        <div class="pasta-bloco">
          <div class="pasta-cabecalho">
            <h3>📁 ${p.nome}</h3>
            <a class="btn btn-outline btn-sm" href="${p.link}" target="_blank" rel="noopener">Abrir no Drive ↗</a>
          </div>
          <div class="empty-state">Não deu pra carregar as fotos dessa pasta aqui — clique em "Abrir no Drive" pra ver.</div>
        </div>`;
    }

    const grade = fotos.map((f) => `
      <button class="foto-thumb" data-foto-id="${f.id}" aria-label="Ver foto ${f.nome}">
        <img src="${f.miniatura}" alt="${f.nome}" loading="lazy">
      </button>`).join("");

    return `
      <div class="pasta-bloco">
        <div class="pasta-cabecalho">
          <h3>📁 ${p.nome}</h3>
          <a class="btn btn-outline btn-sm" href="${p.link}" target="_blank" rel="noopener">Abrir no Drive ↗</a>
        </div>
        <div class="foto-grid" data-fotos="${p.id}">${grade}</div>
      </div>`;
  }

  watchMidia(async (pastas) => {
    if (!pastas.length) {
      wrap.innerHTML = `<div class="empty-state">Ainda não há pastas publicadas. A diretoria pode adicionar pelo painel da liderança.</div>`;
      return;
    }

    wrap.innerHTML = `<div class="empty-state">Carregando fotos...</div>`;
    const comFotos = await Promise.all(
      pastas.map(async (p) => ({ pasta: p, fotos: await buscarFotosDaPasta(p.folderId) }))
    );
    wrap.innerHTML = comFotos.map(({ pasta, fotos }) => cardPasta(pasta, fotos)).join("");

    comFotos.forEach(({ pasta, fotos }) => {
      if (!fotos) return;
      const el = wrap.querySelector(`[data-fotos="${pasta.id}"]`);
      if (!el) return;
      el.querySelectorAll("[data-foto-id]").forEach((btn) => {
        const foto = fotos.find((f) => f.id === btn.dataset.fotoId);
        if (foto) btn.addEventListener("click", () => abrirLightbox(foto));
      });
    });
  });
</script>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
