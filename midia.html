<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mídia — Raízes do Sertão</title><meta name="theme-color" content="#E97305">
<link rel="icon" href="assets/img/logo.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/nordeste.css">
</head>
<body>
<div data-site-header></div>
<main class="section midia-page"><div class="container">
  <div class="section-head midia-heading"><span class="eyebrow">Nossos momentos</span><h1>Galeria de fotos</h1><p>Um pedacinho da nossa história em cada registro. 🌵</p></div>
  <div id="midia-pastas" class="midia-albuns" aria-live="polite"></div><section id="midia-album-aberto" class="midia-album-aberto" hidden aria-label="Fotos do evento"><button type="button" id="midia-voltar" class="midia-voltar">← Voltar aos álbuns</button><div class="midia-evento-head"><h2 id="midia-evento-titulo"></h2><p id="midia-evento-contagem"></p></div><div id="midia-evento-fotos" class="midia-fotos"></div></section>
</div></main>
<div class="midia-lightbox" id="midia-lightbox" hidden role="dialog" aria-modal="true" aria-label="Visualizar foto">
  <button type="button" class="midia-fechar" id="midia-fechar" aria-label="Fechar foto">×</button>
  <div class="midia-lightbox-stage"><button type="button" class="midia-navegar midia-anterior" id="midia-anterior" aria-label="Foto anterior">‹</button><img id="midia-foto-ampliada" alt=""><button type="button" class="midia-navegar midia-proxima" id="midia-proxima" aria-label="Próxima foto">›</button></div><p id="midia-legenda"></p><a id="midia-baixar" class="midia-link midia-download" href="#" target="_blank" rel="noopener noreferrer">⬇ Baixar foto original</a>
</div>
<div data-site-footer></div>
<script type="module">
import { watchMidia } from "./assets/js/store.js";
const wrap = document.getElementById("midia-pastas");
const lightbox = document.getElementById("midia-lightbox");
const fotoAmpliada = document.getElementById("midia-foto-ampliada");
const legenda = document.getElementById("midia-legenda");
const baixar = document.getElementById("midia-baixar");
const anterior = document.getElementById("midia-anterior");
const proxima = document.getElementById("midia-proxima");
let fotosAbertas = [];
let indiceAberto = 0;
let toqueInicial = null;
let focoAnterior = null;
document.getElementById("midia-fechar").addEventListener("click", fecharFoto);
lightbox.addEventListener("click", e => { if (e.target === lightbox) fecharFoto(); });
document.addEventListener("keydown", e => { if (lightbox.hidden) return; if (e.key === "Escape") fecharFoto(); if (e.key === "ArrowRight") navegar(1); if (e.key === "ArrowLeft") navegar(-1); });
anterior.addEventListener("click", () => navegar(-1));
proxima.addEventListener("click", () => navegar(1));
fotoAmpliada.addEventListener("touchstart", e => { toqueInicial = e.changedTouches[0]?.clientX ?? null; }, { passive: true });
fotoAmpliada.addEventListener("touchend", e => { if (toqueInicial === null) return; const delta = e.changedTouches[0].clientX - toqueInicial; toqueInicial = null; if (Math.abs(delta) > 55) navegar(delta < 0 ? 1 : -1); }, { passive: true });
function fecharFoto(){if(lightbox.hidden)return;lightbox.hidden = true;fotoAmpliada.removeAttribute("src");baixar.removeAttribute("href");document.body.style.overflow = "";focoAnterior?.focus();focoAnterior=null;}
function mostrarFoto(){
  const src=fotosAbertas[indiceAberto];
  if(!src)return;
  fotoAmpliada.classList.remove("midia-troca");
  void fotoAmpliada.offsetWidth;
  fotoAmpliada.src=src;
  fotoAmpliada.alt="Foto "+(indiceAberto+1)+" de "+fotosAbertas.length;
  fotoAmpliada.classList.add("midia-troca");
  baixar.href=downloadOriginal(src);
  baixar.textContent=src.includes("drive.google.com") ? "↗ Abrir foto no Drive" : "⬇ Baixar em resolução original";
  const varias=fotosAbertas.length>1;
  anterior.hidden=!varias;proxima.hidden=!varias;
}
function navegar(passo){if(fotosAbertas.length<2)return;indiceAberto=(indiceAberto+passo+fotosAbertas.length)%fotosAbertas.length;mostrarFoto();}
function abrirFoto(fotos,i,titulo,botao){fotosAbertas=fotos;indiceAberto=i;focoAnterior=botao;legenda.textContent=titulo;mostrarFoto();lightbox.hidden=false;document.body.style.overflow="hidden";document.getElementById("midia-fechar").focus();}
function urlFoto(link) {
  try {
    const url = new URL(link);
    if (url.protocol !== "https:") return null;
    if (["drive.google.com","www.drive.google.com"].includes(url.hostname)) {
      const id = url.pathname.match(/\/file\/d\/([\w-]+)/)?.[1] || url.searchParams.get("id");
      return id && /^[\w-]+$/.test(id) ? "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w1600" : null;
    }
    if (url.hostname === "res.cloudinary.com" || url.hostname.endsWith(".res.cloudinary.com")) return url.href;
    return null;
  } catch { return null; }
}
// Miniaturas leves para a galeria; o link de download usa o arquivo original.
function miniatura(src) {
  try {
    const url = new URL(src);
    if (url.hostname === "res.cloudinary.com" && url.pathname.includes("/image/upload/")) {
      url.pathname = url.pathname.replace("/image/upload/", "/image/upload/c_fill,w_640,h_640,q_auto/");
      return url.href;
    }
  } catch {}
  return src;
}
function downloadOriginal(src) {
  try {
    const url = new URL(src);
    if (url.hostname === "res.cloudinary.com" && url.pathname.includes("/image/upload/")) {
      // fl_attachment força o download sem reduzir dimensões nem qualidade.
      url.pathname = url.pathname.replace("/image/upload/", "/image/upload/fl_attachment/");
      return url.href;
    }
  } catch {}
  // Fotos antigas do Drive não garantem download original via miniatura.
  return src;
}
function idPastaDrive(link) {
  try {
    const url = new URL(link);
    if (!["drive.google.com","www.drive.google.com"].includes(url.hostname)) return null;
    const id = url.pathname.match(/\/folders\/([\w-]+)/)?.[1] || url.searchParams.get("id");
    return id && /^[\w-]+$/.test(id) ? id : null;
  } catch { return null; }
}
const albumAberto = document.getElementById("midia-album-aberto");
const eventoFotos = document.getElementById("midia-evento-fotos");
const eventoTitulo = document.getElementById("midia-evento-titulo");
const eventoContagem = document.getElementById("midia-evento-contagem");
const voltar = document.getElementById("midia-voltar");
let albumAtual = null;
let albunsAtuais = [];
voltar.addEventListener("click", () => fecharAlbum());
function fecharAlbum() {
  albumAtual = null;
  albumAberto.hidden = true;
  wrap.hidden = false;
  document.querySelector(".midia-heading").hidden = false;
  window.scrollTo({ top: 0, behavior: "instant" });
}
function abrirAlbum(pasta) {
  albumAtual = pasta.id;
  const fotos = (Array.isArray(pasta.fotos) ? pasta.fotos : []).map(urlFoto).filter(Boolean);
  eventoTitulo.textContent = pasta.nome || "Nosso álbum";
  eventoContagem.textContent = fotos.length === 1 ? "1 foto" : fotos.length + " fotos";
  eventoFotos.replaceChildren();
  fotos.forEach((src, i) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "midia-foto";
    btn.style.setProperty("--foto-ordem", Math.min(i, 11));
    btn.setAttribute("aria-label", "Ampliar foto " + (i + 1));
    const img = document.createElement("img");
    img.src = miniatura(src); img.alt = eventoTitulo.textContent + " — foto " + (i + 1);
    img.loading = "lazy"; img.decoding = "async";
    btn.append(img);
    btn.addEventListener("click", () => abrirFoto(fotos, i, eventoTitulo.textContent, btn));
    eventoFotos.append(btn);
  });
  if (!fotos.length) {
    const vazio = document.createElement("p"); vazio.className = "empty-state";
    vazio.textContent = "Este álbum ainda não tem fotos.";
    eventoFotos.append(vazio);
  }
  wrap.hidden = true;
  document.querySelector(".midia-heading").hidden = true;
  albumAberto.hidden = false;
  window.scrollTo({ top: 0, behavior: "instant" });
  voltar.focus({ preventScroll: true });
}
function render(pastas) {
  albunsAtuais = pastas;
  wrap.replaceChildren();
  if (!pastas.length) {
    const vazio = document.createElement("div"); vazio.className = "empty-state";
    vazio.textContent = "Os álbuns ainda estão sendo preparados. Volte em breve!";
    wrap.append(vazio);
  }
  for (const pasta of pastas) {
    const idDrive = idPastaDrive(pasta.link);
    const fotos = (Array.isArray(pasta.fotos) ? pasta.fotos : []).map(urlFoto).filter(Boolean);
    const card = document.createElement("article"); card.className = "midia-album midia-album-capa";
    const nome = pasta.nome || "Nosso álbum";
    if (idDrive) {
      const link = document.createElement("a");
      link.className = "midia-capa-botao";
      link.href = "https://drive.google.com/drive/folders/" + encodeURIComponent(idDrive);
      link.target = "_blank"; link.rel = "noopener noreferrer";
      const icone = document.createElement("span"); icone.className = "midia-capa-icone"; icone.textContent = "📁";
      const info = document.createElement("div"); info.className = "midia-capa-info";
      const titulo = document.createElement("h2"); titulo.textContent = nome;
      const detalhe = document.createElement("span"); detalhe.textContent = "Google Drive · Abrir pasta ↗";
      info.append(titulo, detalhe); link.append(icone, info); card.append(link);
    } else {
      const botao = document.createElement("button"); botao.type = "button"; botao.className = "midia-capa-botao";
      botao.setAttribute("aria-label", "Abrir álbum " + nome);
      const visual = document.createElement("div"); visual.className = "midia-capa-visual";
      if (fotos.length) {
        const imagem = document.createElement("img"); imagem.src = miniatura(fotos[0]);
        imagem.alt = "Capa do evento " + nome; imagem.loading = "lazy";
        visual.append(imagem);
      } else {
        const icone = document.createElement("span"); icone.className = "midia-capa-icone"; icone.textContent = "📷";
        visual.append(icone);
      }
      const info = document.createElement("div"); info.className = "midia-capa-info";
      const titulo = document.createElement("h2"); titulo.textContent = nome;
      const detalhe = document.createElement("span"); detalhe.textContent = fotos.length === 1 ? "1 foto · Ver álbum →" : fotos.length + " fotos · Ver álbum →";
      info.append(titulo, detalhe); botao.append(visual, info);
      botao.addEventListener("click", () => abrirAlbum(pasta));
      card.append(botao);
    }
    wrap.append(card);
  }
  if (albumAtual !== null) {
    const atualizado = pastas.find(p => p.id === albumAtual);
    if (atualizado) abrirAlbum(atualizado); else fecharAlbum();
  }
}
watchMidia(render);
</script>
<script type="module" src="assets/js/main.js"></script>
</body></html>
