<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mídia — Raízes do Sertão</title>
<meta name="theme-color" content="#E97305">
<link rel="icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div data-site-header></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Registros</span>
      <h1>Mídia</h1>
      <p>Fotos dos nossos eventos, acampamentos e edições do Lava Jato — organizadas em pastas pela diretoria. Clique em "Abrir no Drive" pra ver e baixar as fotos.</p>
    </div>
    <div id="midia-pastas"></div>
  </div>
</section>

<div data-site-footer></div>

<script type="module">
  import { watchMidia } from "./assets/js/store.js";

  const wrap = document.getElementById("midia-pastas");

  watchMidia((pastas) => {
    if (!pastas.length) {
      wrap.innerHTML = `<div class="empty-state">Ainda não há pastas publicadas. A diretoria pode adicionar pelo painel da liderança.</div>`;
      return;
    }
    wrap.innerHTML = pastas
      .map(
        (p) => `<div class="pasta-bloco">
          <div class="pasta-cabecalho">
            <h3>📁 ${p.nome}</h3>
            <a class="btn btn-outline btn-sm" href="${p.link}" target="_blank" rel="noopener">Abrir no Drive ↗</a>
          </div>
        </div>`
      )
      .join("");
  });
</script>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
